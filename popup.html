<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 350px; padding: 15px; font-family: Arial, sans-serif; }
    .header { text-align: center; margin-bottom: 20px; }
    .stats { background: #f5f5f5; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    .btn { 
      width: 100%; 
      padding: 10px; 
      margin: 5px 0; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary { background: #4285f4; color: white; }
    .btn-success { background: #34a853; color: white; }
    .btn-danger { background: #ea4335; color: white; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <h3>🗺️ Maps Lead Scraper</h3>
  </div>
  
  <div class="stats">
    <strong>Collected:</strong> <span id="count">0</span> businesses
  </div>

  <button class="btn btn-primary" id="openMaps">Open Google Maps</button>
  <button class="btn btn-success" id="exportXLSX">Export XLSX</button>
  <button class="btn btn-success" id="exportCSV">Export CSV</button>
  <button class="btn btn-success" id="exportJSON">Export JSON</button>
  <button class="btn btn-danger" id="clearData">Clear All Data</button>

  <script src="popup.js"></script>
</body>
</html>
